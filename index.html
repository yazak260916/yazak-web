<title>Yazak — 디자인 전공자 커뮤니티</title>
<meta name="description" content="크리틱, 작업물, 야작을 함께하는 디자인 전공자 커뮤니티 Yazak">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F4F1;--card:#fff;--ink:#151515;--body:#3A3A38;--muted:#8A8A85;--accent:#5A3CF0;--soft:#EEEAFE;--line:#E9E9E4}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.7;word-break:keep-all}
.wrap{max-width:720px;margin:0 auto;padding:28px 20px 64px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.logo{font-weight:900;font-size:24px;letter-spacing:-.8px;color:var(--ink);text-decoration:none}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav a{font-size:13px;font-weight:500;color:var(--body);text-decoration:none;padding:7px 12px;border-radius:999px;background:var(--card)}
nav a.on{background:var(--accent);color:#fff}
h1{font-size:28px;font-weight:900;letter-spacing:-1px;line-height:1.3;margin:6px 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 20px}
.card{background:var(--card);border-radius:24px;padding:22px 22px 8px;margin-bottom:14px}
.card h2{font-size:16px;font-weight:800;margin:0 0 6px;letter-spacing:-.3px}
.card p{font-size:15px;color:var(--body);margin:0 0 16px;white-space:pre-line}
.hero{background:var(--card);border-radius:28px;padding:32px 24px;margin-bottom:14px}
.hero p{color:var(--body);font-size:16px;margin:8px 0 0}
.links{display:grid;gap:10px}
.links a{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:20px;padding:18px 20px;color:var(--ink);text-decoration:none;font-weight:700;font-size:15px}
.links a span{color:var(--muted);font-weight:500}
.steps{counter-reset:s;list-style:none;padding:0;margin:0 0 16px}
.steps li{counter-increment:s;position:relative;padding:0 0 12px 38px;font-size:15px;color:var(--body)}
.steps li:before{content:counter(s);position:absolute;left:0;top:1px;width:26px;height:26px;border-radius:13px;background:var(--soft);color:var(--accent);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
a.mail{color:var(--accent);font-weight:700;text-decoration:none}
footer{color:var(--muted);font-size:13px;margin-top:26px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<header><a class="logo" href="index.html">Yazak</a></header>

</div>

</html>
